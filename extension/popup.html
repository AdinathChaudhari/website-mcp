<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 280px; margin: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 6px 0; }
  ul { list-style: none; padding: 0; margin: 4px 0; }
  li { display: flex; justify-content: space-between; padding: 2px 0; }
  button { cursor: pointer; }
</style>
<div class="row"><span id="status">checking...</span></div>
<label class="row"><span>Allow website-mcp to run tools</span><input type="checkbox" id="enabled"></label>
<div class="row"><span id="origin"></span><button id="allow">Allow this site</button></div>
<label class="row"><span>Let Claude explore this site: <span id="exploreNote">off</span></span><select id="explore"><option value="off">Off</option><option value="hour">1 hour</option><option value="day">1 day</option><option value="session">Until the browser closes</option></select></label>
<strong>Waiting for approval</strong>
<ul id="pending"></ul>
<strong>Approved tool versions</strong>
<ul id="approved"></ul>
<strong>Allowed sites</strong>
<ul id="sites"></ul>
<script type="module" src="popup.js"></script>
